# version
config-version = 2

# commands to run on start
after-startup-command = []

# autostart aerospace
start-at-login = true

# auto reload
auto-reload-config = true

# normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# accordion settings
accordion-padding = 30

# default container config
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# unhide macOS apps
automatically-unhide-macos-hidden-apps = false

# hooks
on-mode-changed = []
on-focused-monitor-changed = []
on-focus-changed = []

# focus follow mouse
focus-follows-mouse.enabled = false

on-window-detected = [{ if = 'true', run = 'layout floating' }]

# PiP rule: floating and above windows on all workspaces
exec-on-workspace-change = ['/bin/bash', '-c', '''
/opt/homebrew/bin/aerospace list-windows --all --format '%{window-id}%{tab}%{workspace}%{tab}%{window-title}' |
/usr/bin/awk -F'\t' -v ws="$AEROSPACE_FOCUSED_WORKSPACE" 'tolower($3) ~ /^ *picture[- ]in[- ]picture *$/ && $2 != ws { print $1 }' |
while read -r id; do
    /opt/homebrew/bin/aerospace move-node-to-workspace --window-id "$id" "$AEROSPACE_FOCUSED_WORKSPACE"
done
''']

# keyboard layout
key-mapping.preset = 'qwerty'

# gaps
gaps.inner.horizontal = 0
gaps.inner.vertical =   0
gaps.outer.left =       0
gaps.outer.bottom =     0
gaps.outer.top =        0
gaps.outer.right =      0

# workspace assignments
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

[workspace-to-monitor-force-assignment]
    1 = 'main'
    2 = 'main'
    3 = 'main'
    4 = 'main'
    5 = 'main'
    6 = 'main'
    7 = 'main'
    8 = 'main'
    9 = 'secondary'
    10 = 'main'

# keybindings

[mode.main.binding]
    alt-enter = '''exec-and-forget running=$(/usr/bin/osascript -e 'application id "com.mitchellh.ghostty" is running') || exit
        if [ "$running" = true ]; then
            /usr/bin/osascript -e 'tell application "Ghostty" to new window'
        else
            /usr/bin/open -a "/Applications/Ghostty.app"
        fi'''
    alt-shift-o = 'exec-and-forget /usr/bin/open "obsidian://open?vault=chisano-work"'
    alt-ctrl-shift-o = 'exec-and-forget /usr/bin/open "obsidian://open?vault=chisano"'

    # cycle windows in workspace
    cmd-backtick = '''exec-and-forget ids=$(/opt/homebrew/bin/aerospace list-windows --workspace focused --format '%{window-id}' | /usr/bin/sort -n)
        cur=$(/opt/homebrew/bin/aerospace list-windows --focused --format '%{window-id}')
        next=$(printf '%s\n' "$ids" | /usr/bin/awk -v c="$cur" 'NR==1{f=$0} h&&!d{print;d=1} $0==c{h=1} END{if(!d)print f}')
        [ -n "$next" ] && /opt/homebrew/bin/aerospace focus --window-id "$next"'''

    # focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # workspace
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 10'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 10'

    # toggle workspaces
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # modes bindings
    # alt-shift-semicolon = 'mode service'
    alt-w = 'close --quit-if-last-window'

