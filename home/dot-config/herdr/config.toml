onboarding = false
[theme]
name = "catppuccin"

# pane focus with arrows
[keys]
new_workspace = ""
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "drovr.move-pane"
description = "move pane"

[[keys.command]]
key = "prefix+shift+n"
type = "popup"
command = "zsh -c 'read \"n?workspace name: \"; [ -n \"$n\" ] && herdr workspace create --label \"$n\" --focus'"
width = 50
height = 2

[terminal]
default_shell = "zsh"

[ui]
# panes border
pane_gaps = false
# pane_outer_borders = false

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true


