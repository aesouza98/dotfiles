# tmux config - based on Sin-cy/dotfiles, prefix C-b, default keys kept (see README.md)

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g display-time 2000
set -g detach-on-destroy off
set -g status-interval 5
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g prefix C-b
set -g prefix2 none

# Terminal (true color, extended keys for Claude/Devin shift+enter)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys,xterm-256color:RGB"
set -g extended-keys on

# Copy: mouse select copies to macOS clipboard and leaves copy mode (explicit so reload resets)
set -s copy-command pbcopy
set -g pane-scrollbars off
bind -T copy-mode MouseDown1Pane select-pane
bind -T copy-mode-vi MouseDown1Pane select-pane
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode DoubleClick1Pane { select-pane; send -X select-word; send -X copy-pipe-and-cancel }
bind -T copy-mode-vi DoubleClick1Pane { select-pane; send -X select-word; send -X copy-pipe-and-cancel }
bind -T copy-mode TripleClick1Pane { select-pane; send -X select-line; send -X copy-pipe-and-cancel }
bind -T copy-mode-vi TripleClick1Pane { select-pane; send -X select-line; send -X copy-pipe-and-cancel }
bind -n DoubleClick1Pane { select-pane -t =; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H; send -X select-word; send -X copy-pipe-and-cancel } }
bind -n TripleClick1Pane { select-pane -t =; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H; send -X select-line; send -X copy-pipe-and-cancel } }

# Keys: reload and cheatsheet
bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf recarregado"
bind -N "Show keybindings (fzf)" ? display-popup -E -w 80% -h 80% -T " Keybindings " "tmux list-keys -N | fzf --reverse --no-sort --prompt='keys > '"

# Keys: same dir on new window/split, extra split key, copy mode, sessions
bind -N "New window (same dir)" c new-window -c "#{pane_current_path}"
bind -N "Split below (same dir)" '"' split-window -v -c "#{pane_current_path}"
bind -N "Split right (same dir)" % split-window -h -c "#{pane_current_path}"
bind -N "Split right (same dir)" | split-window -h -c "#{pane_current_path}"
bind -N "Enter copy mode" v copy-mode
bind -N "New session (workspace)" N command-prompt -p "new session:" "new-session -A -s '%%'"
bind -N "Kill session (confirm)" X confirm-before -p "kill session #S? (y/n)" kill-session

# Keys: floating apps
bind -N "Floating shell" C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "zsh"
bind -N "Floating yazi" C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi"
bind -N "Floating lazygit" C-g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# Keys: workmux
bind -N "workmux dashboard" W display-popup -E -w 90% -h 70% -T " workmux " "workmux dashboard"
bind -N "workmux sidebar" b run-shell "workmux sidebar"
bind -N "workmux: last done agent" g run-shell "workmux last-done"
bind -N "workmux: toggle last agent" Tab run-shell "workmux last-agent"


# Status left
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Status right
set -g status-right-length 250
set -g status-right ""
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_rosewater}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
# Status bar (Sin-cy layout, colors from @thm_* aliases in the theme)
set -g status-position bottom
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# Windows
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_overlay_1}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -g window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_blue},fg=#{@thm_bg},bold"

# Panes, messages, popups
set -g pane-border-style "fg=#{@thm_surface_0}"
set -g pane-active-border-style "fg=#{@thm_blue}"
set -g message-style "bg=#{@thm_surface_0},fg=#{@thm_fg}"
set -g message-command-style "bg=#{@thm_surface_0},fg=#{@thm_yellow}"
set -g mode-style "bg=#{@thm_surface_2},fg=#{@thm_fg}"
set -g popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g popup-border-style "fg=#{@thm_blue}"
set -g menu-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g menu-selected-style "fg=#{@thm_blue},bold"

# Plugins (TPM in ~/.config/tmux/plugins; prefix I installs, prefix U updates)
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

# Sessionx (prefix S), tmux-fzf (prefix F)
set -g @sessionx-bind 'S'
set -g @sessionx-git-branch 'on'
set -g @sessionx-preview-location 'top'
set -g @sessionx-preview-ratio '53%'
set -g @sessionx-zoxide-mode on
set -g @sessionx-window-mode off
set -g @tmux-fzf-launch-key F

# Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Online status
set -g @online_icon "ok"
set -g @offline_icon "nok"

# Resurrect/continuum: prefix C-s save, prefix C-r restore, autosave every 15 min
set -g @resurrect-capture-pane-contents on
set -g @continuum-restore on
set -g @continuum-save-interval 15

# Keep last
run '~/.config/tmux/plugins/tpm/tpm'
