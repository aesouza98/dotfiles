# tmux config - prefix stays C-b, default keys kept (see README.md)

# Theme (palette in ~/.config/themes/current/tmux.conf)
source-file -q ~/.config/themes/current/tmux.conf

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g display-time 2000
set -g detach-on-destroy off
set -g status-interval 5
set -g automatic-rename off
set -g allow-rename off
set-hook -g after-new-window 'if -F "#{m:*sh,#{window_name}}" "rename-window \"\""'
set-hook -g after-new-session 'if -F "#{m:*sh,#{window_name}}" "rename-window \"\""'

# Terminal (true color, extended keys for Claude/Devin shift+enter)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys,xterm-256color:RGB"
set -g extended-keys on

# Copy: selecting with the mouse copies to macOS clipboard and leaves copy mode (tmux defaults)
set -s copy-command pbcopy
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode DoubleClick1Pane { select-pane; send -X select-word; send -X copy-pipe-and-cancel }
bind -T copy-mode-vi DoubleClick1Pane { select-pane; send -X select-word; send -X copy-pipe-and-cancel }
bind -T copy-mode TripleClick1Pane { select-pane; send -X select-line; send -X copy-pipe-and-cancel }
bind -T copy-mode-vi TripleClick1Pane { select-pane; send -X select-line; send -X copy-pipe-and-cancel }
bind -n DoubleClick1Pane { select-pane -t =; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H; send -X select-word; send -X copy-pipe-and-cancel } }
bind -n TripleClick1Pane { select-pane -t =; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H; send -X select-line; send -X copy-pipe-and-cancel } }
# Click in copy mode: tmux default (explicit so reload resets it)
bind -T copy-mode MouseDown1Pane select-pane
bind -T copy-mode-vi MouseDown1Pane select-pane
set-hook -g pane-mode-changed 'refresh-client -S'
set -g pane-scrollbars off

# Keys: reload
bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf recarregado"

# Keys: keybinding cheatsheet (fzf popup)
bind -N "Show keybindings (fzf)" ? display-popup -E -w 80% -h 80% -T " Keybindings " "tmux list-keys -N | fzf --reverse --no-sort --prompt='keys > '"

# Keys: keep cwd on new window/split, new session
bind -N "New window (same dir)" c new-window -c "#{pane_current_path}"
bind -N "Split below (same dir)" '"' split-window -v -c "#{pane_current_path}"
bind -N "Split right (same dir)" % split-window -h -c "#{pane_current_path}"
bind -N "Kill session (confirm)" X confirm-before -p "kill session #S? (y/n)" kill-session
bind -N "New session (workspace)" N command-prompt -p "new session:" "new-session -A -s '%%'"

# Keys: workmux
bind -N "workmux dashboard" W display-popup -E -w 90% -h 70% -T " workmux " "workmux dashboard"
bind -N "workmux sidebar" C-t run-shell "workmux sidebar"
bind -N "workmux: last done agent" g run-shell "workmux last-done"
bind -N "workmux: toggle last agent" Tab run-shell "workmux last-agent"

# Layout: 1 line at bottom - session left, tabs center, info right
set -g status on
set -g status-position bottom
set -g status-left-length 60
set -g status-right-length 100
# Left and right blocks have the same plain width (46) so tabs sit at the true center
set -g status-left "#[fg=#{@t_purple},bold] #{p12:session_name} #[default]#{?client_prefix,#[fg=#{@t_yellow}]#[bold] PREFIX #[default],#{?pane_in_mode,#[fg=#{@t_cyan}]#[bold]  COPY  #[default],#{?window_zoomed_flag,#[fg=#{@t_green}]#[bold]  ZOOM  #[default],#{p8:@pad}}}}#{p24:@pad}"
set -g status-right "#[default]#[fg=#{@t_cyan}]#{p-18:#(~/.config/tmux/repo-branch '#{pane_current_path}')}  #[fg=#{@t_fg}]#(TZ=America/Sao_Paulo date +%H:%M) BRT #[fg=#{@t_muted}]#(TZ=UTC date +%H:%M) UTC #[fg=#{@t_blue}]%d/%m "
set -g status-style "bg=#{@t_bg},fg=#{@t_muted}"
set -g status-format[0] "#[align=left]#{T:status-left}#[align=centre]#{W:#[range=window|#{window_index}]#{E:window-status-format}#[norange],#[range=window|#{window_index}]#{E:window-status-current-format}#[norange]}#[align=right]#{T:status-right}"

# Tabs (workmux agent icon comes from @workmux_status)
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@t_muted}] #I#{?#{==:#W,},,. #W}#{?@workmux_status, #{@workmux_status},}#{?window_bell_flag, !,} #[default]"
set -g window-status-current-format "#[fg=#{@t_bg},bg=#{@t_blue},bold] #I#{?#{==:#W,},,. #W}#{?@workmux_status, #{@workmux_status},}#{?window_bell_flag, !,} #[default]"
set -g window-status-bell-style "fg=#{@t_red},bold"
set -g window-status-activity-style "fg=#{@t_yellow}"

# Panes and messages
set -g pane-border-style "fg=#{@t_surface}"
set -g pane-active-border-style "fg=#{@t_blue}"
set -g message-style "bg=#{@t_surface},fg=#{@t_fg}"
set -g message-command-style "bg=#{@t_surface},fg=#{@t_yellow}"
set -g mode-style "bg=#{@t_select},fg=#{@t_fg}"
set -g popup-style "bg=#{@t_bg},fg=#{@t_fg}"
set -g popup-border-style "fg=#{@t_blue}"
set -g menu-style "bg=#{@t_bg},fg=#{@t_fg}"
set -g menu-selected-style "fg=#{@t_blue},bold"

# Plugins (TPM, installed in ~/.config/tmux/plugins; prefix I installs, prefix U updates)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'

# Resurrect/continuum: prefix C-s save, prefix C-r restore, autosave every 15 min
set -g @resurrect-capture-pane-contents on
set -g @continuum-restore on
set -g @continuum-save-interval 15

# tmux-fzf (prefix F) and sessionx (prefix S)
set -g @tmux-fzf-launch-key F
set -g @sessionx-bind S
set -g @sessionx-zoxide-mode on
set -g @sessionx-window-mode off

# Keep last
run '~/.config/tmux/plugins/tpm/tpm'
