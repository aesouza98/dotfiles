# tmux palette for kanagawa (read by ~/.config/tmux/tmux.conf)
set -g @t_bg      "#1f1f28"
set -g @t_surface "#2a2a37"
set -g @t_muted   "#727169"
set -g @t_fg      "#dcd7ba"
set -g @t_red     "#e46876"
set -g @t_green   "#98bb6c"
set -g @t_yellow  "#e6c384"
set -g @t_blue    "#7e9cd8"
set -g @t_purple  "#957fb8"
set -g @t_cyan    "#6a9589"
set -g @t_select  "#54546d"
set -g display-panes-active-colour "#7e9cd8"
# Aliases for the status bar (Sin-cy layout)
set -g @thm_bg        "#1f1f28"
set -g @thm_red       "#e46876"
set -g @thm_green     "#98bb6c"
set -g @thm_yellow    "#e6c384"
set -g @thm_blue      "#7e9cd8"
set -g @thm_rosewater "#dcd7ba"
set -g @thm_overlay_0 "#727169"
set -g @thm_overlay_1 "#929081"
