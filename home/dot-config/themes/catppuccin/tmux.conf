# tmux palette for catppuccin (read by ~/.config/tmux/tmux.conf)
set -g @t_bg      "#1e1e2e"
set -g @t_surface "#313244"
set -g @t_muted   "#7f849c"
set -g @t_fg      "#cdd6f4"
set -g @t_red     "#f38ba8"
set -g @t_green   "#a6e3a1"
set -g @t_yellow  "#f9e2af"
set -g @t_blue    "#89b4fa"
set -g @t_purple  "#cba6f7"
set -g @t_cyan    "#94e2d5"
set -g @t_select  "#585b70"
set -g display-panes-active-colour "#89b4fa"
# Aliases for the status bar (Sin-cy layout)
set -g @thm_bg        "#1e1e2e"
set -g @thm_red       "#f38ba8"
set -g @thm_green     "#a6e3a1"
set -g @thm_yellow    "#f9e2af"
set -g @thm_blue      "#89b4fa"
set -g @thm_rosewater "#cdd6f4"
set -g @thm_overlay_0 "#7f849c"
set -g @thm_overlay_1 "#969db6"
