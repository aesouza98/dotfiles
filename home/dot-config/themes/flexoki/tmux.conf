# tmux palette for flexoki (read by ~/.config/tmux/tmux.conf)
set -g @t_bg      "#100f0f"
set -g @t_surface "#1c1b1a"
set -g @t_muted   "#878580"
set -g @t_fg      "#cecdc3"
set -g @t_red     "#d14d41"
set -g @t_green   "#879a39"
set -g @t_yellow  "#ad8301"
set -g @t_blue    "#4385be"
set -g @t_purple  "#ce5d97"
set -g @t_cyan    "#3aa99f"
set -g @t_select  "#403e3c"
set -g display-panes-active-colour "#4385be"
# Aliases for the status bar (Sin-cy layout)
set -g @thm_bg        "#100f0f"
set -g @thm_red       "#d14d41"
set -g @thm_green     "#879a39"
set -g @thm_yellow    "#ad8301"
set -g @thm_blue      "#4385be"
set -g @thm_rosewater "#cecdc3"
set -g @thm_overlay_0 "#878580"
set -g @thm_overlay_1 "#9c9b94"
