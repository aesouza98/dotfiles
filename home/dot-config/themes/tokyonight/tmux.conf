set -g display-panes-active-colour "#7aa2f7"
# Aliases for the status bar (Sin-cy layout)
set -g @thm_bg        "#24283b"
set -g @thm_red       "#f7768e"
set -g @thm_green     "#9ece6a"
set -g @thm_yellow    "#e0af68"
set -g @thm_blue      "#7aa2f7"
set -g @thm_rosewater "#c0caf5"
