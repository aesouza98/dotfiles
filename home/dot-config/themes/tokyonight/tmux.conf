set -g @t_surface "#2f334d"
set -g @t_muted   "#737aa2"
set -g @t_fg      "#c0caf5"
set -g @t_red     "#f7768e"
set -g @t_green   "#9ece6a"
set -g @t_yellow  "#e0af68"
set -g @t_blue    "#7aa2f7"
set -g @t_purple  "#bb9af7"
set -g @t_cyan    "#7dcfff"
set -g @t_select  "#414868"
set -g display-panes-active-colour "#7aa2f7"
