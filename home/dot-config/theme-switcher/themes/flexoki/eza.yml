  special_other: {foreground: "#575653"}
  attribute: {foreground: "#878580"}

size:
  major: {foreground: "#878580"}
  minor: {foreground: "#3aa99f"}
  number_byte: {foreground: "#cecdc3"}
  number_kilo: {foreground: "#cecdc3"}
  number_mega: {foreground: "#4385be"}
  number_giga: {foreground: "#ce5d97"}
