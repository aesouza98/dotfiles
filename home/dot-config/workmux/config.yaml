# workmux global config - tmux backend, Claude as default agent
agent: claude
nerdfont: true
merge_strategy: merge

# workmux adds agent status icons to the tab format itself
status_format: true

sidebar:
  width: 45

# Agent pane (focused) + shell pane below
panes:
  - command: <agent>
    focus: true
  - split: horizontal
    size: 25

# Layout alternativo com Devin (workmux add feat -l devin)
layouts:
  devin:
    panes:
      - command: devin-wm
        focus: true
      - split: horizontal
        size: 25
