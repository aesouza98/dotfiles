# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = uwsm app -- brave --new-window --ozone-platform=wayland

# Applications
bind = SUPER, return, exec, $terminal
bind = SUPER, E, exec, uwsm app -- nautilus --new-window
bind = SUPER, B, exec, $browser
bind = SUPER, M, exec, uwsm app -- spotify
bind = SUPER, N, exec, $terminal -e nvim
bind = SUPER, T, exec, $terminal -e btop
bind = SUPER SHIFT, D, exec, $terminal -e lazydocker
bind = SUPER, O, exec, uwsm app -- obsidian -disable-gpu
bind = SUPER, slash, exec, uwsm app -- bitwarden-desktop

# Web Apps
bind = SUPER, A, exec, omanano-launch-webapp "https://chatgpt.com"
bind = SUPER, S, exec, omanano-launch-webapp "https://stardewvalleywiki.com/Stardew_Valley_Wiki"
bind = SUPER, Y, exec, omanano-launch-webapp "https://youtube.com/"
bind = SUPER SHIFT, G, exec, omanano-launch-webapp "https://web.whatsapp.com/"
bind = SUPER, X, exec, omanano-launch-webapp "https://x.com/"

# Launcher
bindd = SUPER, D, Launch apps, exec, walker -p "Start…"

# media
bindd = ,XF86AudioRaiseVolume, Volume up, exec, $osdclient --output-volume 2
bindd = ,XF86AudioLowerVolume, Volume down, exec, $osdclient --output-volume -2
bindel = SUPER, F1, exec, $osdclient --input-volume mute-toggle

dwindle {
  special_scale_factor=0.75 # Makes special workspace use only 75% of screen
}

# Screenshotting
bind = SUPER SHIFT, S, exec, ~/.local/bin/screenshot
